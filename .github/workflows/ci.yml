name: CI

on:
  push:
  pull_request:

jobs:
  shared-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate fixtures and require no diff
        run: |
          python3 tools/fixtures/generate_frames.py
          python3 tools/fixtures/generate_eq_vectors.py
          git diff --exit-code shared/

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests (protocol, session, conformance, EQ, profiles)
        working-directory: macos
        run: swift test
      - name: Universal app bundle (ad-hoc signed)
        working-directory: macos
        run: Scripts/build_app.sh release

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Core tests and debug APK
        working-directory: android
        run: ./gradlew :core:test :app:assembleDebug --console=plain
