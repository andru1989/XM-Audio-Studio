name: CI

on:
  push:
  pull_request:

jobs:
  shared-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerated fixtures match the committed ones (float tolerance)
        run: python3 tools/fixtures/check_up_to_date.py

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests (protocol, session, conformance, EQ, profiles, DSP, widget bridge)
        working-directory: macos
        run: swift test
      - name: App bundle (arm64; the universal build needs a newer Xcode than the runner's)
        working-directory: macos
        env:
          XMAS_ARCHS: arm64
        run: Scripts/build_app.sh release

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The runner image ships an Android SDK (ANDROID_HOME); install only what the build needs.
      - name: Android SDK packages
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
      - name: Core and app unit tests, debug APK
        working-directory: android
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug --console=plain
